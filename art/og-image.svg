       Re-make it with (Quick Look draws an 800px-wide page, hence width="800"):
         qlmanage -t -s 2400 -o /tmp art/og-image.svg
         magick /tmp/og-image.svg.png -crop 2400x1260+0+0 +repage -resize 1200x630! -strip og-image.png -->
  <defs>
    <radialGradient id="glow" cx="0.88" cy="0" r="0.75">
      <stop offset="0" stop-color="#f5b301" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5b301" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#11161d"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="606" width="1200" height="24" fill="#f5b301"/>
