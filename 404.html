<!DOCTYPE html>
<!-- The server (server/src/eande/Server.java) shows this page whenever someone visits an address that doesn't exist. -->
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- Tells search engines not to list this page. -->
    <meta name="robots" content="noindex">
    <title>Page not found · E&amp;E Electrical &amp; Maintenance</title>
    <!-- The full path is needed because this page can show up at any address, even /a/b/c. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- For the same reason, a link to style.css could point to the wrong place, so the styles live here. -->
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #11161d;
        color: #eef1f4;
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 0 clamp(16px, 4vw, 32px);
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 0 0 0.4em;
      }

      p {
        color: #a3adb9;
        margin: 0 0 1.5em;
      }

      .button {
        display: inline-block;
        background-color: #f5b301;
        color: #11161d;
        font-weight: 700;
        padding: 14px 24px;
        border-radius: 10px;
        text-decoration: none;
      }

      .button:hover {
        background-color: #ffc629;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Page not found.</h1>
      <p>That address doesn't lead anywhere. Let's get you back.</p>
      <a class="button" href="/">Back to the homepage</a>
    </main>
  </body>
</html>
